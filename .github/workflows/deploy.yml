name: Deploy to Timeweb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate deployment settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for key in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR SSH_KNOWN_HOSTS; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing setting: $key"
              exit 1
            fi
          done
          if [[ "$FTP_SERVER_DIR" == / || "$FTP_SERVER_DIR" == ./ || "$FTP_SERVER_DIR" == *..* || "$FTP_SERVER_DIR" != */ ]]; then
            echo '::error::Set FTP_SERVER_DIR to the dedicated website directory, ending in / (not FTP root).'
            exit 1
          fi
          if [[ ! "$FTP_SERVER" =~ ^[a-zA-Z0-9.-]+$ || ! "$FTP_USERNAME" =~ ^[a-zA-Z0-9_.-]+$ || ! "$FTP_SERVER_DIR" =~ ^[a-zA-Z0-9_./-]+$ ]]; then
            echo '::error::Invalid server, username or deployment directory.'
            exit 1
          fi
      - run: npm install
      - run: npm run build
      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Upload dist to Timeweb over SFTP (port 22)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22" -e "
            set cmd:fail-exit yes;
            set net:timeout 30;
            set net:max-retries 2;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes';
            mirror --reverse --verbose ./dist/ $FTP_SERVER_DIR;
            bye;
          "
