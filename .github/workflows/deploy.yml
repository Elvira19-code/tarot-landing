name: Deploy to Timeweb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate deployment settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          for key in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing setting: $key"
              exit 1
            fi
          done
          if [[ "$FTP_SERVER_DIR" == / || "$FTP_SERVER_DIR" == ./ || "$FTP_SERVER_DIR" == *..* || "$FTP_SERVER_DIR" != */ ]]; then
            echo '::error::Set FTP_SERVER_DIR to the dedicated website directory, ending in / (not FTP root).'
            exit 1
          fi
      - run: npm install
      - run: npm run build
      - name: Upload dist to Timeweb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
