server {
    listen 80;
    listen [::]:80;
    server_name taroway.com www.taroway.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://taroway.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.taroway.com;
    ssl_certificate /etc/letsencrypt/live/taroway.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taroway.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://taroway.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name taroway.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/taroway.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taroway.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /var/www/taroway;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4325;
        proxy_set_header Host taroway.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_cache off;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
